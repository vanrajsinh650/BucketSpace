services:
  - type: web
    name: bucketspace
    runtime: node
    plan: starter
    region: oregon
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: TELEGRAM_API_ID
        sync: false
      - key: TELEGRAM_API_HASH
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: UPLOAD_TIMEOUT_MS
        value: "300000"

